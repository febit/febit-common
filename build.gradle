//  configurations.configureEach { resolutionStrategy.cacheChangingModulesFor 0, 'seconds' }
//}
plugins {
  alias libs.plugins.febit.java
  alias libs.plugins.febit.maven.publish
  alias libs.plugins.febit.codegen.module
}

group = 'org.febit'
version = '4.2.0-M1'

description = 'Febit Commons'

ext {
}

def customPom = { Project project, MavenPom pom ->
  pom.with {
    name.set project.name
    description.set project.description
    url.set 'https://github.com/febit/febit-common'
    organization {
      name = 'Febit'
      url = 'https://github.com/febit'
    }
    licenses {
      license {
        name = 'Apache License, Version 2.0'
        url = 'https://github.com/febit/febit-common/blob/main/LICENSE.txt'
        distribution = 'repo'
      }
    }
    scm {
      url = 'https://github.com/febit/febit-common'
      connection = 'scm:git:https://github.com/febit/febit-common.git'
      developerConnection = 'scm:git:https://github.com/febit/febit-common.git'
    }
    issueManagement {
      system = 'GitHub'
      url = 'https://github.com/febit/febit-common/issues'
    }
    developers {
      developer {
        id = 'kurt'
        name = 'Kurt Zhu'
        email = 'kurt@febit.org'
        timezone = '+8'
      }
    }
  }
}

allprojects { subproject ->

  group = rootProject.group
  version = rootProject.version

  repositories {
    mavenCentral()
  }

  standardMavenPublish {
    pom {
      customPom(subproject, it)
    }
  }

  codegenModule {
    defaultTemplate = fromFile("$rootDir/etc/module.java.tmpl")
  }

  spotless {
    java {
      licenseHeaderFile rootProject.file('etc/license-header.txt')

      shortenFullyQualifiedTypes()

      cleanthat()
          .addMutator('SafeAndConsensual')
          .addMutator('PMD')
          .addMutator('Stream')
          .addMutator('SpotBugs')

      removeUnusedImports()
      importOrder(
          '',
          'org.febit',
          'jakarta.persistence|jakarta.validation|lombok|org.jspecify',
          'jakarta|java|javax',
          '\\#', '\\#jakarta|\\#java|\\#javax'
      )

      // tableTestFormatter()
    }
  }
}

def LIBS = libs

configure(subprojects.findAll {
  !it.name.endsWith('-bom')
}) {
  apply plugin: 'java-library'

  java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withJavadocJar()
    withSourcesJar()
  }

  tasks.named('jar', Jar) {
    doLast {
      def amn = manifest.attributes['Automatic-Module-Name']
      if (!amn) {
        throw new GradleException(
            "Project '${project.name}' jar is missing 'Automatic-Module-Name'. " +
                "Declare it in ${project.name}/build.gradle, e.g.:\n" +
                "jar { manifest { attributes('Automatic-Module-Name': '<module-name>') } }"
        )
      }
    }
  }

  dependencies {
    if (project.name != 'febit-annotations-optional') {
      compileOnly project(':febit-annotations-optional')
      testCompileOnly project(':febit-annotations-optional')
    }

    testImplementation 'org.slf4j:slf4j-simple'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.tabletest:tabletest-junit'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  dependencyManagement {
    resolutionStrategy {
      cacheChangingModulesFor 0, 'seconds'
    }
    imports {
      mavenBom "${LIBS.assertj.bom.get()}"
      mavenBom "${LIBS.jackson.bom.get()}"
      mavenBom "${LIBS.junit.bom.get()}"
      mavenBom "${LIBS.mockito.bom.get()}"
      mavenBom "${LIBS.okhttp.bom.get()}"
      mavenBom "${LIBS.testcontainers.bom.get()}"
    }
    dependencies {
      dependencySet(group: 'org.slf4j', version: "${LIBS.versions.slf4j.get()}") {
        entry 'jcl-over-slf4j'
        entry 'jul-to-slf4j'
        entry 'log4j-over-slf4j'
        entry 'slf4j-api'
        entry 'slf4j-nop'
        entry 'slf4j-simple'
      }

      dependencySet(group: 'io.swagger.core.v3', version: "${LIBS.versions.swagger.get()}") {
        entry 'swagger-annotations'
        entry 'swagger-annotations-jakarta'
        entry 'swagger-core'
        entry 'swagger-core-jakarta'
      }
      dependencySet(group: 'io.etcd', version: "${LIBS.versions.jetcd.get()}") {
        entry 'jetcd-grpc'
        entry 'jetcd-api'
        entry 'jetcd-common'
        entry 'jetcd-launcher'
        entry 'jetcd-test'
        entry 'jetcd-core'
        entry 'jetcd-ctl'
      }

      dependency "${LIBS.jspecify.get()}"
      dependency "${LIBS.jsr305.get()}"
      dependency "${LIBS.spotbugs.annotations.get()}"
      dependency "${LIBS.swagger.annotations.get()}"

      dependency "${LIBS.jakarta.annotation.api.get()}"
      dependency "${LIBS.jakarta.persistence.api.get()}"
      dependency "${LIBS.jakarta.validation.api.get()}"
      dependency "${LIBS.jakarta.xml.bind.api.get()}"

      dependency "${LIBS.commons.cli.get()}"
      dependency "${LIBS.commons.codec.get()}"
      dependency "${LIBS.commons.collections4.get()}"
      dependency "${LIBS.commons.compress.get()}"
      dependency "${LIBS.commons.csv.get()}"
      dependency "${LIBS.commons.exec.get()}"
      dependency "${LIBS.commons.io.get()}"
      dependency "${LIBS.commons.lang3.get()}"
      dependency "${LIBS.commons.pool2.get()}"
      dependency "${LIBS.commons.text.get()}"

      dependency "${LIBS.caffeine.get()}"
      dependency "${LIBS.disruptor.get()}"
      dependency "${LIBS.h2database.get()}"
      dependency "${LIBS.hamcrest.get()}"
      dependency "${LIBS.jcommander.get()}"
      dependency "${LIBS.jool.get()}"
      dependency "${LIBS.jsonpath.get()}"
      dependency "${LIBS.kafka.clients.get()}"
      dependency "${LIBS.nimbus.jose.jwt.get()}"
      dependency "${LIBS.protobuf.java.get()}"
      dependency "${LIBS.semver4j.get()}"
      dependency "${LIBS.snakeyaml.engine.get()}"
      dependency "${LIBS.snakeyaml2.get()}"
      dependency "${LIBS.tabletest.junit.get()}"
      dependency "${LIBS.uuid.generator.get()}"
    }
  }
}
