import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    mavenCentral()
  }
}

rootProject.name = 'febit-commons'

include 'febit-annotations-optional'
include 'febit-commons-bom'
include 'febit-commons-dependencies'
include 'febit-lang'
include 'febit-commons-etcd'
include 'febit-commons-stuff'
include 'febit-commons-jooq'
include 'febit-commons-jsonrpc2'
include 'febit-commons-rest-client'
include 'febit-commons-test'
include 'febit-commons-rabbit'
